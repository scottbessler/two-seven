name: Update snapshots
# Regenerates the Playwright image baselines in the same pinned container CI
# compares them against, and commits them to the branch. This is the supported
# way to update baselines: no contributor needs a local Docker daemon, and a
# baseline can never be produced by a host whose fonts differ from CI's.
#
# Two ways in, because `workflow_dispatch` only resolves once the file is on the
# default branch — which would make this unusable on the very branch that
# changes rendering, before it merges:
#   * Actions -> Update snapshots -> Run workflow (pick the branch), or
#   * push a commit whose message contains [update-snapshots].
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate baselines on and push back to
        required: true
        type: string
      grep:
        description: Optional Playwright --grep filter (empty updates all)
        required: false
        type: string
  push:
    branches-ignore: [main]
jobs:
  server:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-snapshots]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - run: cargo build --locked
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-server-snapshots
          path: target/debug/two-seven
          retention-days: 1
  update:
    needs: server
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.54.1-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
      # The Playwright image ships no unzip, which setup-bun needs to unpack
      # the release it downloads.
      - run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: e2e-server-snapshots
          path: target/debug
      - run: chmod +x target/debug/two-seven
      # --update-snapshots rewrites the baselines, so a failing comparison is the
      # point here, not an error. Keep going and let the diff be the result.
      - run: bun run test:e2e -- --update-snapshots ${{ inputs.grep && format('--grep {0}', inputs.grep) || '' }}
        continue-on-error: true
        env:
          E2E_SERVER_BIN: target/debug/two-seven
          E2E_IMAGES: "1"
      - name: Commit regenerated baselines
        # The image's default shell is dash, which has no pipefail.
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- tests/e2e; then
            echo "Baselines already match this branch — nothing to commit."
            exit 0
          fi
          git add tests/e2e
          git commit -m "Regenerate Playwright baselines in the pinned container"
          git push origin "HEAD:${{ inputs.branch || github.ref_name }}"
