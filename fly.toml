app = 'two-seven'
primary_region = 'sjc'
kill_signal = 'SIGINT'
kill_timeout = '5s'
[build]
  dockerfile = 'Dockerfile'
[env]
  DATA_PATH = '/data'
  PORT = '8080'
  RP_ID = 'two-seven.fly.dev'
  RP_ORIGIN = 'https://two-seven.fly.dev'
  # SESSION_SECRET is set as a Fly secret.
[processes]
  app = '/app/two-seven'
[[mounts]]
  source = 'data'
  destination = '/data'
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20
  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthcheck'
    protocol = 'http'
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
